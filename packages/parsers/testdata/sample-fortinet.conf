#config-version FGT-VM64-7.4.0
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.1.1 255.255.255.0
    next
    edit "port2"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
    next
end
config firewall address
    edit "web-srv"
        set subnet 10.0.1.10 255.255.255.255
    next
    edit "lan-net"
        set subnet 10.0.0.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "internal-hosts"
        set member "web-srv" "lan-net"
    next
end
config firewall service custom
    edit "APP_TCP"
        set tcp-portrange 8443
    next
end
config firewall ippool
    edit "snat-pool"
        set startip 203.0.113.10
        set endip 203.0.113.20
    next
end
config firewall vip
    edit "vip-https"
        set extip 203.0.113.5
        set mappedip 10.0.1.10
        set extport 443
        set mappedport 443
    next
end
config firewall policy
    edit 1
        set name "allow-internal-to-web"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "lan-net"
        set dstaddr "web-srv"
        set action accept
        set status enable
        set service "HTTP" "HTTPS" "APP_TCP"
    next
    edit 2
        set name "deny-bad"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set status enable
        set service "ALL"
    next
    edit 3
        set name "utm-then-disabled"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set status disable
        set service "HTTP"
        set av-profile "default"
        set schedule "always"
    next
end
